document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

5,.035);\n    --glass-strong:rgba(255,255,255,.06);\n    --radius:20px;\n    --shadow:0 24px 60px -28px rgba(0,0,0,.85);\n  }\n\n  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}\n\n  html,body{background:var(--bg-0);}\n\n  body{\n    font-family:'Manrope',system-ui,-apple-system,sans-serif;\n    color:var(--ink);\n    line-height:1.55;\n    min-height:100dvh;\n    position:relative;\n    overflow-x:hidden;\n    padding:0 0 max(48px,env(safe-area-inset-bottom));\n    background:\n      radial-gradient(120% 70% at 50% -8%, rgba(216,175,82,.22), transparent 55%),\n      radial-gradient(90% 55% at 12% 8%, rgba(52,199,133,.12), transparent 60%),\n      radial-gradient(100% 60% at 100% 18%, rgba(58,96,210,.16), transparent 60%),\n      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%, #04060d 100%);\n    background-attachment:fixed;\n  }\n\n  /* subtle pitch lines texture */\n  body::before{\n    content:\"\";\n    position:fixed;\n    inset:0;\n    pointer-events:none;\n    background-image:\n      repeating-linear-gradient(0deg, transparent 0 58px, rgba(255,255,255,.018) 58px 59px);\n    mask-image:linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);\n    z-index:0;\n  }\n\n  .wrap{\n    position:relative;\n    z-index:1;\n    width:100%;\n    max-width:480px;\n    margin:0 auto;\n    padding:0 20px;\n  }\n\n  /* ---------- HERO ---------- */\n  header.hero{\n    text-align:center;\n    padding:54px 0 8px;\n  }\n  .crest{\n    width:74px;height:74px;\n    margin:0 auto 20px;\n    display:grid;place-items:center;\n    font-size:34px;\n    border-radius:50%;\n    background:radial-gradient(circle at 50% 30%, rgba(243,216,137,.28), rgba(243,216,137,.04));\n    border:1px solid var(--line);\n    box-shadow:0 0 0 6px rgba(216,175,82,.05), inset 0 1px 0 rgba(255,255,255,.18);\n    position:relative;\n    animation:floaty 5s ease-in-out infinite;\n  }\n  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}\n\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:8px;\n    font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--gold-1);\n    padding:7px 14px;border-radius:999px;\n    border:1px solid var(--line);\n    background:var(--glass);\n    margin-bottom:18px;\n  }\n  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}\n\n  h1.title{\n    font-family:'Anton',sans-serif;\n    font-weight:400;\n    line-height:.94;\n    letter-spacing:.01em;\n    font-size:clamp(52px,17vw,76px);\n    text-transform:uppercase;\n    background:linear-gradient(180deg,#fff 0%,var(--gold-1) 42%,var(--gold-2) 78%,var(--gold-3) 100%);\n    -webkit-background-clip:text;background-clip:text;\n    -webkit-text-fill-color:transparent;color:transparent;\n    text-shadow:0 0 38px rgba(216,175,82,.25);\n    margin:4px 0 2px;\n  }\n  h1.title .yr{display:block;font-size:1.06em;letter-spacing:.06em;}\n\n  .subtitle{\n    color:var(--muted);\n    font-size:16px;\n    font-weight:500;\n    max-width:330px;\n    margin:14px auto 0;\n    text-wrap:balance;\n  }\n  .subtitle b{color:var(--ink);font-weight:700;}\n\n  /* ---------- COUNTDOWN ---------- */\n  .countdown{\n    margin:30px auto 6px;\n  }\n  .cd-label{\n    font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;\n    color:var(--faint);text-align:center;margin-bottom:14px;\n  }\n  .cd-grid{\n    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;\n  }\n  .cd-cell{\n    background:var(--glass);\n    border:1px solid var(--line);\n    border-radius:16px;\n    padding:14px 4px 10px;\n    text-align:center;\n    backdrop-filter:blur(8px);\n    position:relative;overflow:hidden;\n  }\n  .cd-cell::after{content:\"\";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(243,216,137,.5),transparent);}\n  .cd-num{\n    font-family:'Anton',sans-serif;\n    font-size:34px;line-height:1;\n    color:var(--ink);\n    font-variant-numeric:tabular-nums;\n  }\n  .cd-unit{\n    display:block;margin-top:6px;\n    font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;\n    color:var(--faint);\n  }\n  .cd-foot{\n    text-align:center;margin-top:14px;font-size:13px;color:var(--muted);\n  }\n  .cd-foot b{color:var(--gold-1);font-weight:700;}\n\n  /* ---------- INFO BOX ---------- */\n  .info{\n    margin-top:32px;\n    display:flex;gap:13px;\n    padding:16px 16px 17px;\n    border-radius:16px;\n    background:linear-gradient(180deg, rgba(58,96,210,.10), rgba(58,96,210,.03));\n    border:1px solid rgba(120,150,235,.22);\n  }\n  .info .ic{flex:0 0 auto;font-size:18px;line-height:1.4;}\n  .info p{font-size:13.5px;color:#c5d0e6;}\n  .info p+p{margin-top:8px;}\n  .info b{color:#fff;font-weight:700;}\n  .info .upd{color:var(--green);font-weight:700;}\n\n  /* ---------- SECTION HEADERS ---------- */\n  .sec-head{\n    display:flex;align-items:center;gap:8px;\n    margin:38px 0 6px;\n  }\n  .sec-head .lbl{\n    font-family:'Anton',sans-serif;font-weight:400;\n    font-size:13px;letter-spacing:.16em;text-transform:uppercase;\n    color:var(--faint);\n    white-space:nowrap;\n  }\n  .sec-head .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}\n\n  /* ---------- CHOICE CARDS ---------- */\n  .card{\n    border-radius:var(--radius);\n    border:1px solid var(--line);\n    background:var(--glass-strong);\n    padding:20px 18px;\n    backdrop-filter:blur(10px);\n    box-shadow:var(--shadow);\n    margin-bottom:16px;\n  }\n  .card.alert{border-color:rgba(240,181,74,.26);background:linear-gradient(180deg,rgba(240,181,74,.07),var(--glass-strong));}\n  .card.silent{border-color:rgba(52,199,133,.22);background:linear-gradient(180deg,rgba(52,199,133,.055),var(--glass-strong));}\n\n  .card-top{display:flex;align-items:flex-start;gap:13px;margin-bottom:4px;}\n  .badge{\n    flex:0 0 auto;width:46px;height:46px;border-radius:14px;\n    display:grid;place-items:center;font-size:22px;\n    border:1px solid var(--line);\n  }\n  .card.alert .badge{background:rgba(240,181,74,.12);border-color:rgba(240,181,74,.3);}\n  .card.silent .badge{background:rgba(52,199,133,.10);border-color:rgba(52,199,133,.28);}\n  .card-ttl{font-size:19px;font-weight:800;letter-spacing:-.01em;}\n  .card-sub{font-size:13.5px;color:var(--muted);margin-top:2px;}\n\n  .warn{\n    display:flex;gap:10px;align-items:flex-start;\n    margin:14px 0 4px;padding:12px 13px;\n    border-radius:12px;\n    background:rgba(240,181,74,.10);\n    border:1px solid rgba(240,181,74,.3);\n    font-size:12.5px;line-height:1.5;color:#f4ddb0;\n  }\n  .warn .wi{flex:0 0 auto;font-size:14px;}\n  .warn b{color:#ffe9bf;font-weight:800;}\n  .warn .kbd{\n    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;\n    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);\n    padding:1px 6px;border-radius:6px;white-space:nowrap;color:#ffe9bf;\n  }\n\n  .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px;}\n\n  .btn{\n    display:flex;align-items:center;justify-content:center;gap:10px;\n    width:100%;\n    padding:15px 18px;\n    border-radius:14px;\n    font-family:'Manrope',sans-serif;font-size:15.5px;font-weight:700;\n    text-decoration:none;cursor:pointer;border:1px solid transparent;\n    transition:transform .15s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;\n    position:relative;overflow:hidden;\n  }\n  .btn .gi{font-size:17px;line-height:1;}\n  .btn:active{transform:scale(.975);}\n\n  .btn-primary{\n    color:#241a06;\n    background:linear-gradient(180deg,var(--gold-1),var(--gold-2));\n    box-shadow:0 10px 24px -12px rgba(216,175,82,.85), inset 0 1px 0 rgba(255,255,255,.5);\n  }\n  .btn-primary::after{\n    content:\"\";position:absolute;top:0;left:-60%;width:40%;height:100%;\n    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);\n    transform:skewX(-20deg);transition:left .6s ease;\n  }\n  .btn-primary:hover::after{left:130%;}\n  .btn-primary:hover{box-shadow:0 14px 30px -10px rgba(216,175,82,.95), inset 0 1px 0 rgba(255,255,255,.5);}\n\n  .btn-ghost{\n    color:var(--ink);\n    background:rgba(255,255,255,.05);\n    border-color:rgba(255,255,255,.14);\n  }\n  .btn-ghost:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24);}\n\n  .dl{\n    display:block;text-align:center;margin-top:12px;\n    font-size:12.5px;color:var(--faint);text-decoration:none;\n    transition:color .2s ease;\n  }\n  .dl u{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.25);}\n  .dl:hover{color:var(--muted);}\n\n  /* ---------- LEAGUE CARD ---------- */\n  .league{\n    margin-top:40px;\n    border-radius:24px;\n    padding:26px 20px 24px;\n    position:relative;overflow:hidden;\n    border:1px solid rgba(243,216,137,.4);\n    background:\n      radial-gradient(120% 90% at 90% 0%, rgba(52,199,133,.22), transparent 55%),\n      radial-gradient(120% 90% at 0% 100%, rgba(216,175,82,.22), transparent 55%),\n      linear-gradient(180deg, rgba(30,40,72,.85), rgba(12,18,38,.92));\n    box-shadow:0 30px 70px -30px rgba(216,175,82,.5), var(--shadow);\n  }\n  .league::before{\n    content:\"\";position:absolute;inset:0;border-radius:24px;padding:1px;\n    background:linear-gradient(135deg,rgba(243,216,137,.7),transparent 35%,transparent 65%,rgba(52,199,133,.6));\n    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);\n    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;\n  }\n  .league-tag{\n    display:inline-flex;align-items:center;gap:7px;\n    font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;\n    color:var(--green);\n    padding:6px 12px;border-radius:999px;\n    background:rgba(52,199,133,.12);border:1px solid rgba(52,199,133,.3);\n    margin-bottom:14px;\n  }\n  .league h2{\n    font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.12;\n  }\n  .league .lead{font-size:14.5px;color:#cfd8ea;margin-top:9px;}\n  .league .lead b{color:#fff;}\n  .league .lead .ligue{color:var(--gold-1);font-weight:800;}\n\n  .code-row{\n    margin:20px 0 16px;\n  }\n  .code-cap{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;}\n  .code-box{\n    display:flex;align-items:center;gap:12px;\n    padding:14px 14px 14px 18px;\n    border-radius:16px;\n    background:rgba(0,0,0,.4);\n    border:1px dashed rgba(243,216,137,.5);\n  }\n  .code-val{\n    font-family:ui-monospace,Menlo,monospace;\n    font-size:30px;font-weight:700;letter-spacing:.14em;\n    color:var(--gold-1);\n    flex:1;line-height:1;\n    text-shadow:0 0 24px rgba(243,216,137,.3);\n  }\n  .copy-btn{\n    flex:0 0 auto;\n    display:inline-flex;align-items:center;gap:7px;\n    padding:11px 15px;border-radius:11px;\n    font-family:'Manrope',sans-serif;font-size:13.5px;font-weight:700;\n    cursor:pointer;\n    color:var(--ink);\n    background:rgba(255,255,255,.07);\n    border:1px solid rgba(255,255,255,.18);\n    transition:all .2s ease;\n  }\n  .copy-btn:hover{background:rgba(255,255,255,.13);}\n  .copy-btn:active{transform:scale(.95);}\n  .copy-btn.ok{color:#07120c;background:linear-gradient(180deg,#5fe0a3,var(--green-deep));border-color:transparent;}\n\n  .btn-join{\n    color:#07120c;\n    background:linear-gradient(180deg,#54dd9b,var(--green-deep));\n    box-shadow:0 14px 30px -12px rgba(52,199,133,.8), inset 0 1px 0 rgba(255,255,255,.4);\n    font-size:16.5px;\n  }\n  .btn-join::after{\n    content:\"\";position:absolute;top:0;left:-60%;width:40%;height:100%;\n    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);\n    transform:skewX(-20deg);transition:left .6s ease;\n  }\n  .btn-join:hover::after{left:130%;}\n  .btn-join:hover{box-shadow:0 18px 36px -10px rgba(52,199,133,.95), inset 0 1px 0 rgba(255,255,255,.4);}\n\n  /* ---------- FOOTER NOTE ---------- */\n  .foot{\n    margin-top:34px;\n    padding:18px 4px 0;\n    border-top:1px solid rgba(255,255,255,.07);\n  }\n  .foot h3{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;}\n  .foot-grid{display:grid;gap:12px;}\n  .foot-item{font-size:12.5px;color:var(--muted);line-height:1.5;}\n  .foot-item b{color:var(--ink);font-weight:700;}\n  .foot-item .pill{\n    display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;\n    padding:2px 8px;border-radius:6px;margin-right:7px;vertical-align:1px;\n  }\n  .pill.sub{color:var(--gold-1);background:rgba(243,216,137,.1);border:1px solid rgba(243,216,137,.3);}\n  .pill.dl{color:#bcd;background:rgba(120,150,235,.1);border:1px solid rgba(120,150,235,.3);}\n\n  .sign{text-align:center;font-size:11px;color:var(--faint);margin-top:26px;letter-spacing:.04em;}\n  .sign span{color:var(--gold-3);}\n\n  /* ---------- PARCOURS DES BLEUS ---------- */\n  .parcours{margin-top:40px;}\n  .parcours .sec-head{margin-top:0;}\n  .parcours .sec-head .lbl{color:var(--gold-1);}\n\n  .parcours-note{\n    text-align:center;font-size:11.5px;color:var(--faint);\n    margin-top:16px;letter-spacing:.01em;line-height:1.5;\n  }\n  .parcours-note b{color:var(--muted);font-weight:600;}\n\n  /* --- 3D (desktop) : caché par défaut --- */\n  .parcours-3d{display:none;}\n\n  /* --- Timeline (mobile / petit écran) --- */\n  .timeline{position:relative;margin-top:20px;padding-left:38px;}\n  .tl-axis{position:absolute;left:17px;top:8px;bottom:8px;width:2px;\n    background:linear-gradient(180deg,rgba(243,216,137,.5),rgba(52,199,133,.5));border-radius:2px;}\n  .tl-plane{position:absolute;left:8px;font-size:18px;\n    animation:tlfly 6s ease-in-out infinite;filter:drop-shadow(0 2px 6px rgba(243,216,137,.5));}\n  @keyframes tlfly{\n    0%{top:0;transform:rotate(96deg);opacity:0;}\n    8%{opacity:1;}\n    92%{opacity:1;}\n    100%{top:calc(100% - 22px);transform:rotate(96deg);opacity:0;}\n  }\n  .tl-item{position:relative;margin-bottom:18px;}\n  .tl-item:last-child{margin-bottom:0;}\n  .tl-dot{\n    position:absolute;left:-30px;top:4px;width:24px;height:24px;border-radius:50%;\n    display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:13px;\n    color:#241a06;background:linear-gradient(180deg,var(--gold-1),var(--gold-2));\n    box-shadow:0 0 0 4px rgba(243,216,137,.12),0 6px 14px -6px rgba(216,175,82,.8);\n  }\n  .tl-card{\n    border-radius:16px;border:1px solid var(--line);\n    background:var(--glass-strong);backdrop-filter:blur(8px);\n    padding:13px 15px;\n  }\n  .tl-step{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;}\n  .tl-match{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.2;}\n  .tl-match .vs{color:var(--faint);font-weight:600;margin:0 4px;}\n  .tl-meta{font-size:13px;color:var(--gold-1);font-weight:700;margin-top:6px;}\n  .tl-where{font-size:12.5px;color:var(--muted);margin-top:3px;}\n  .tl-tv{display:inline-block;font-size:11px;font-weight:700;color:var(--green);\n    margin-top:8px;padding:3px 9px;border-radius:7px;\n    background:rgba(52,199,133,.10);border:1px solid rgba(52,199,133,.28);}\n  .tl-tv.tbc{color:var(--faint);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);}\n\n  /* --- Bascule desktop : 3D affichée, timeline masquée + section élargie --- */\n  @media (min-width:900px){\n    .parcours{position:relative;left:50%;transform:translateX(-50%);width:min(940px,94vw);}\n    .parcours-3d{display:block;}\n    .timeline{display:none;}\n  }\n\n  .parcours-3d{\n    position:relative;margin-top:18px;\n    height:clamp(440px,46vw,560px);\n    border-radius:24px;overflow:hidden;\n    border:1px solid var(--line);\n    background:\n      radial-gradient(120% 100% at 50% -10%, rgba(58,96,210,.16), trans sition.set(-6, 12, 6); scene.add(key);\n      var rim = new THREE.DirectionalLight(0x5a88e6, 0.7);\n      rim.position.set(8, 6, -8); scene.add(rim);\n\n      // --- Grille océan ---\n      var grid = new THREE.GridHelper(40, 40, 0xd8af52, 0x1a2340);\n      grid.position.y = -0.32;\n      grid.material.transparent = true; grid.material.opacity = 0.18;\n      scene.add(grid);\n\n      // --- Continent extrudé ---\n      var shape = new THREE.Shape();\n      CONTINENT.forEach(function(p,i){ i ? shape.lineTo(p[0],p[1]) : shape.moveTo(p[0],p[1]); });\n      shape.closePath();\n      var landGeo = new THREE.ExtrudeGeometry(shape, { depth:0.3, bevelEnabled:false });\n      var landMat = new THREE.MeshStandardMaterial({ color:0x22325a, metalness:0.25, roughness:0.7, emissive:0x18254a, emissiveIntensity:0.85 });\n      var land = new THREE.Mesh(landGeo, landMat);\n      land.rotation.x = -Math.PI/2;\n      land.position.y = -0.3;\n      scene.add(land);\n\n      // Liseré doré (côtes)\n      var edges = new THREE.EdgesGeometry(landGeo);\n      var coast = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color:0xf6dd9a, transparent:true, opacity:0.7 }));\n      coast.rotation.x = -Math.PI/2; coast.position.y = -0.3 + 0.31;\n      scene.add(coast);\n\n      // --- Marqueurs stades ---\n      var markers = STADES.map(function(s){\n        var g = new THREE.Group();\n        g.position.set(s.pos.x, 0, s.pos.z);\n        var beam = new THREE.Mesh(\n          new THREE.CylinderGeometry(0.035, 0.05, 1.3, 12),\n          new THREE.MeshBasicMaterial({ color:0xf3d889, transparent:true, opacity:0.28 }));\n        beam.position.y = 0.65; g.add(beam);\n        var orb = new THREE.Mesh(\n          new THREE.SphereGeometry(0.16, 20, 20),\n          new THREE.MeshStandardMaterial({ color:0xf3d889, emissive:0xf3d889, emissiveIntensity:1.4, roughness:0.3 }));\n        orb.position.y = 0.42; g.add(orb);\n        var ring = new THREE.Mesh(\n          new THREE.RingGeometry(0.22, 0.30, 32),\n          new THREE.MeshBasicMaterial({ color:0xf3d889, transparent:true, opacity:0.5, side:THREE.DoubleSide }));\n        ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; g.add(ring);\n        scene.add(g);\n        return { group:g, orb:orb, ring:ring, beam:beam, data:s,\n                 top:new THREE.Vector3(s.pos.x, 1.35, s.pos.z),\n                 anchor:new THREE.Vector3(s.pos.x, 0.5, s.pos.z) };\n      });\n\n      // --- Étiquettes de ville permanentes (toujours visibles) ---\n      markers.forEach(function(m, i){\n        var el = document.createElement(\"div\");\n        el.className = \"city-pin\";\n        el.innerHTML = '<span class=\"cp-num\">' + (i+1) + '<\u002Fspan>' + m.data.short;\n        host.appendChild(el);\n        m.pin = el;\n      });\n\n      // --- Trajet (boucle fermée NY → Philly → Boston → NY) ---\n      var stops = STADES.map(function(s){ return new THREE.Vector3(s.pos.x, 1.5, s.pos.z); });\n      var curve = new THREE.CatmullRomCurve3(stops, true, \"catmullrom\", 0.4);\n      var pts = curve.getPoints(220);\n      var routeLine = new THREE.Line(\n        new THREE.BufferGeometry().setFromPoints(pts),\n        new THREE.LineBasicMaterial({ color:0xf3d889, transparent:true, opacity:0.55 }));\n      scene.add(routeLine);\n      var routeGlow = new THREE.Line(\n        new THREE.BufferGeometry().setFromPoints(pts),\n        new THREE.LineBasicMaterial({ color:0xffe9bf, transparent:true, opacity:0.15 }));\n      routeGlow.scale.set(1,1,1); scene.add(routeGlow);\n\n      // --- Avion low-poly ---\n      function buildPlane(){\n        var grp = new THREE.Group();\n        var gold = new THREE.MeshStandardMaterial({ color:0xf3d889, metalness:0.6, roughness:0.3, emissive:0x5a4310, emissiveIntensity:0.5 });\n        var body = new THREE.MeshStandardMaterial({ color:0xf6f4ec, metalness:0.25, roughness:0.5 });\n        var fus = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.10,0.95,14), body);\n        fus.rotation.z = Math.PI/2; grp.add(fus);\n        var nose = new THREE.Mesh(new THREE.ConeGeometry(0.12,0.32,14), gold);\n        nose.rotation.z = -Math.PI/2; nose.position.x = 0.62; grp.add(nose);\n        var wing = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.045,1.25), gold);\n        grp.add(wing);\n        var tailW = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.035,0.55), gold);\n        tailW.position.x = -0.44; grp.add(tailW);\n        var fin = new THREE.Mesh(new THREE.BoxGeometry(0.20,0.30,0.045), gold);\n        fin.position.set(-0.45, 0.14, 0); grp.add(fin);\n        grp.scale.setScalar(0.72);\n        return grp;\n      }\n      var plane = buildPlane();\n      scene.add(plane);\n\n      // --- Projection 3D → écran pour le label HTML ---\n      function project(v){\n        var w = host.clientWidth, h = host.clientHeight;\n        var p = v.clone().project(camera);\n        return { x:(p.x*0.5+0.5)*w, y:(-p.y*0.5+0.5)*h, infront:p.z < 1 };\n      }\n      var lastCity = null;\n      function setLabel(m){\n        if (m.data.ville !== lastCity){\n          lastCity = m.data.ville;\n          labelEl.querySelector(\".sl-city\").textContent = m.data.ville;\n          labelEl.querySelector(\".sl-match\").textContent = m.data.match;\n          labelEl.querySelector(\".sl-meta\").innerHTML = m.data.date + \" · <b>\" + m.data.heure + \"<\u002Fb>\";\n          var tv = labelEl.querySelector(\".sl-tv\");\n          tv.textContent = \"📺 \" + m.data.tv;\n          tv.className = \"sl-tv\" + (m.data.tbc ? \" tbc\" : \"\");\n        }\n        var sc = project(m.top);\n        var below = sc.y < 120;\n        labelEl.classList.toggle(\"below\", below);\n        var lx = Math.max(108, Math.min(host.clientWidth - 108, sc.x));\n        labelEl.style.left = lx + \"px\";\n        labelEl.style.top = sc.y + \"px\";\n        labelEl.classList.add(\"show\");\n      }\n\n      // --- Boucle d'animation ---\n      var t = 0, clock = new THREE.Clock();\n      function animate(){\n        requestAnimationFrame(animate);\n        var dt = Math.min(clock.getDelta(), 0.05);\n        t = (t + dt * 0.035) % 1;\n\n        var pos = curve.getPointAt(t);\n        var tan = curve.getTangentAt(t).normalize();\n        plane.position.copy(pos);\n        plane.position.y = 1.5 + Math.sin(t * Math.PI * 6) * 0.06;\n        plane.quaternion.setFromUnitVectors(FORWARD, tan);\n\n        // Caméra : léger survol cinématique (AVANT toute projection écran)\n        var now = performance.now();\n        var a = now * 0.00010;\n        camera.position.x = FOCUS.x - 1 + Math.sin(a) * 1.1;\n        camera.position.z = FOCUS.z + 9.6 + Math.cos(a) * 0.8;\n        camera.position.y = 12 + Math.sin(a * 0.7) * 0.5;\n        camera.lookAt(FOCUS);\n        camera.updateMatrixWorld(true); // matrices à jour avant project()\n\n        // Stade le plus proche + étiquettes\n        var cw = host.clientWidth;\n        var nearest = null, nd = 1e9, pinList = [];\n        markers.forEach(function(m){\n          var dx = pos.x - m.data.pos.x, dz = pos.z - m.data.pos.z;\n          var d = Math.sqrt(dx*dx + dz*dz);\n          if (d < nd){ nd = d; nearest = m; }\n          var active = d < 1.3;\n          var pulse = active ? (1 + Math.sin(now*0.006) * 0.35) : 1;\n          m.ring.scale.setScalar(pulse);\n          m.ring.material.opacity = active ? 0.65 : 0.32;\n          m.orb.material.emissiveIntensity = active ? 2.2 : 1.2;\n          m.orb.scale.setScalar(active ? 1.25 : 1);\n          if (m.pin){\n            var ps = project(m.anchor);\n            var flip = ps.x > cw * 0.6;\n            m.pin.classList.toggle(\"left\", flip);\n            m.pin.style.left = Math.max(8, Math.min(cw - 8, ps.x)) + \"px\";\n            m.pin.classList.toggle(\"active\", active);\n            pinList.push({ pin:m.pin, y:ps.y });\n          }\n        });\n        // Décalage vertical anti-chevauchement (villes très proches)\n        pinList.sort(function(p,q){ return p.y - q.y; });\n        for (var i = 1; i < pinList.length; i++){\n          if (pinList[i].y < pinList[i-1].y + 32) pinList[i].y = pinList[i-1].y + 32;\n        }\n        pinList.forEach(function(o){ o.pin.style.top = o.y + \"px\"; });\n        if (nearest && nd < 2.2) setLabel(nearest);\n        else labelEl.classList.remove(\"show\");\n\n        // Label pays sur la carte\n        var cps = project(COUNTRY);\n        countryEl.style.left = cps.x + \"px\";\n        countryEl.style.top = cps.y + \"px\";\n\n        renderer.render(scene, camera);\n      }\n      camera.updateMatrixWorld(true);\n      animate();\n\n      // --- Redimensionnement ---\n      window.addEventListener(\"resize\", function(){\n        if (!mq.matches) return;\n        W = host.clientWidth; H = host.clientHeight;\n        camera.aspect = W / H; camera.updateProjectionMatrix();\n        renderer.setSize(W, H);\n      });\n    };\n  })();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
